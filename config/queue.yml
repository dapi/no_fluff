default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # High priority workers - realtime operations
    - queues: "realtime"
      threads: 3
      processes: <%= ENV.fetch("REALTIME_CONCURRENCY", 2) %>
      polling_interval: 0.1

    # Medium-high priority - user-facing features
    - queues: "digest,default"
      threads: 5
      processes: <%= ENV.fetch("DIGEST_CONCURRENCY", 3) %>
      polling_interval: 0.5

    # Medium priority - content processing
    - queues: "content,channels"
      threads: 4
      processes: <%= ENV.fetch("CONTENT_CONCURRENCY", 2) %>
      polling_interval: 1

    # Low priority - background maintenance
    - queues: "ai,low_priority"
      threads: 2
      processes: <%= ENV.fetch("BACKGROUND_CONCURRENCY", 1) %>
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
