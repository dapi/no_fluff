default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Channel monitoring and post fetching
    - queues: "channels"
      threads: 2
      processes: <%= ENV.fetch("CHANNELS_CONCURRENCY", 1) %>
      polling_interval: 1

    # Content processing and delivery
    - queues: "content"
      threads: 3
      processes: <%= ENV.fetch("CONTENT_CONCURRENCY", 2) %>
      polling_interval: 0.5

    # Notifications (channel deactivation, user notifications)
    - queues: "notifications"
      threads: 2
      processes: <%= ENV.fetch("NOTIFICATIONS_CONCURRENCY", 1) %>
      polling_interval: 0.3

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
