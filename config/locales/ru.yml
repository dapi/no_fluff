# Russian locale file for NoFluff application

ru:
  hello: "Привет мир"

  telegram_bot:
    start:
      welcome: |
        👋 Привет! Я бот "Без Шелухи"

        Ты подписан на десятки Telegram-каналов, но читаешь лишь 10%?
        Я буду следить за ними и присылать тебе только важное.
        Без рекламы. Без шелухи.

        📊 Экономь до 30 минут в день на чтение каналов.

        Начнём?
      button_start: "🚀 Давай начнём"
      button_more_info: "ℹ️ Подробнее"
      first_admin: |
        🎉 Поздравляю! Ты стал первым администратором системы!

        Теперь у тебя есть доступ к административным функциям.
        Отвечу на любые вопросы по управлению ботом.

        А теперь начнём настройку:

    more_info:
      text: |
        ℹ️ Как это работает?

        1️⃣ Ты добавляешь свои Telegram-каналы
        2️⃣ Я читаю все посты и фильтрую важное с помощью AI
        3️⃣ Присылаю тебе дайджест в удобное время

        ✨ Что я умею:
        • 🎯 Фильтрую важное, убираю рекламу и шелуху
        • 📝 Делаю саммари или присылаю полные тексты
        • ⏰ Контролируешь частоту (от реального времени до раза в неделю)
        • 🤖 Учусь на твоих лайках/дизлайках
        • 🔍 Рекомендую похожие каналы

        🆓 Бесплатно: до 10 каналов
        💎 Premium: безлимит каналов + приоритет + аналитика
      button_lets_start: "🚀 Начать использовать"

    onboarding:
      add_channels: |
        Отлично!

        📢 Пришли мне ссылки на Telegram-каналы, за которыми я буду следить.

        Можешь отправить:
        • Ссылку: t.me/channelname
        • Пересланное сообщение из канала
        • Несколько каналов сразу (каждый с новой строки)

        Например:
        t.me/habr_com
        t.me/dev_channel
        t.me/tech_news

        💡 Рекомендую начать с 5-10 каналов.
      button_my_subscriptions: "📋 Мои подписки"

    errors:
      general: "Произошла ошибка. Попробуйте позже."

    help:
      commands: |
        📱 Доступные команды:

        /start — начать заново
        /add — добавить каналы
        /remove — удалить каналы
        /list — мои каналы
        /settings — настройки
        /digest — показать дайджест сейчас
        /stats — статистика
        /help — помощь
      admin_commands: |
        🔐 Команды администратора:

        /channels — список всех каналов в системе
        /remember <имя> — запомнить данные в сессии
        /recall — вспомнить данные из сессии
        /forget — очистить сессию
        /session_info — информация о текущей сессии

    channels:
      add:
        prompt: |
          📢 Отправь мне ссылку или имя канала.

          Можешь отправить:
          • Имя: @channelname
          • Ссылку: t.me/channelname или https://t.me/channelname
          • Несколько каналов (каждый с новой строки)

          Например:
          @habr_com
          t.me/dev_channel
          https://t.me/tech_news
        success: "✅ Канал %{channel} добавлен!\n\nВсего каналов: %{count}"
        suggest_another: "💪 Отлично!\nДобавляй следующий канал - присылай ссылку или имя"
        already_subscribed: "ℹ️ Ты уже подписан на канал %{channel}. Присылай ссылку на другой"
        not_found: "❌ Канал %{channel} не найден или недоступен"
        invalid_format: "❌ Неверный формат. Отправь имя канала (@channelname) или ссылку (t.me/channelname)"
        error: "❌ Ошибка при добавлении канала: %{error}"
        limit_reached: |
          ❌ Достигнут лимит бесплатных каналов (%{limit} из %{current}).

          💎 Оформи подписку для добавления неограниченного количества каналов!

      remove:
        prompt: |
          📢 Отправь мне имя или ссылку на канал для удаления.

          Можешь отправить:
          • Имя: @channelname
          • Ссылку: t.me/channelname или https://t.me/channelname

          Например:
          @habr_com
          t.me/dev_channel
          https://t.me/tech_news
        success: "✅ Канал %{channel} удалён!\n\nВсего каналов: %{count}"
        not_found: "❌ Канал %{channel} не найден в твоих подписках"
        not_subscribed: "ℹ️ Ты не подписан на канал %{channel}"
        invalid_format: "❌ Неверный формат. Отправь имя канала (@channelname) или ссылку (t.me/channelname)"
        error: "❌ Ошибка при удалении канала: %{error}"

      list:
        title: "📋 Мои подписки"
        empty: "У тебя пока нет подписок. Просто накидай каналы в чат списком, и я их добавлю."
        total: "Всего каналов: %{count}"
        buttons:
          remove: "🗑️"
          settings: "⚙️"
        confirm_remove: "Удалить %{channel} из подписок?"
        remove_success: "Канал %{channel} удалён из подписок"

      list:
        title: "📊 Список каналов в системе (всего: %{count})"
        admin_only: "🚫 У вас нет прав для выполнения этой команды. Доступно только администраторам."
        empty: "📭 В системе пока нет каналов."
        pagination_info: "Страница %{current} из %{total}"
        previous_page: "← Предыдущая"
        next_page: "Следующая →"
        close: "✖️ Закрыть"
        closed: "Список каналов закрыт"
        subscribers: "подписчиков"
        last_post: "Последний пост:"

    settings:
      title: "⚙️ Настройки"
      current_settings: "📋 Текущие настройки:"
      delivery_frequency:
        title: "⏰ Частота доставки"
        label: "⏰ Частота доставки: "
        button: "⏰ Частота доставки"
        success: "✅ Частота доставки изменена на: %{value}"
        options:
          real_time: "Реальное время"
          three_times_daily: "3 раза в день"
          twice_daily: "2 раза в день"
          once_daily: "Раз в день"
          every_few_days: "Раз в несколько дней"
          weekly: "Раз в неделю"
          on_demand: "По запросу"
      content_format:
        title: "📝 Формат контента"
        label: "📝 Формат контента: "
        button: "📝 Формат контента"
        success: "✅ Формат контента изменён на: %{value}"
        options:
          original: "Оригинальные посты"
          summaries: "Саммари"
          unified_digest: "Единый дайджест"
          combo: "Комбо"
          headlines: "Заголовки"
      filter_strictness:
        title: "🎯 Строгость фильтрации"
        label: "🎯 Строгость фильтрации: "
        button: "🎯 Строгость фильтрации"
        success: "✅ Строгость фильтрации изменена на: %{value}"
        options:
          ultra: "Ультра"
          high: "Высокая"
          medium: "Средняя"
          low: "Низкая"
          smart: "Умная"

    media:
      not_supported: |
        К сожалению, я пока не понимаю такого типа сообщений.
        Отправьте мне текстом ссылку на канал, за которым вы хотите следить,
        и получать анонсы только по важным новостям, без шелухи.

    admin_sessions:
      access_denied: "🚫 У вас нет прав для выполнения этой команды. Доступно только администраторам."
      remember:
        prompt: "Пожалуйста, укажите имя после команды: /remember ваше_имя"
        success: "Я запомнил ваше имя: %{name}"
      recall:
        success: "Привет, %{name}! Я помню ваше имя."
        empty: "Я еще не знаю вашего имени. Используйте /remember ваше_имя"
      forget:
        success: "Я все забыл. Начнем заново!"
      info:
        empty: "Сессия пуста. Нет сохраненных данных."
        data: |
          📊 Данные сессии:
          %{data}
    subscription:
      success: "🎉 Подписка активирована! Теперь вы можете добавлять неограниченное количество каналов."
      deactivated: "✅ Подписка деактивирована."
      deactivated_with_limit_warning: |
        ⚠️ Подписка деактивирована.

        У вас %{current} каналов, что превышает бесплатный лимит (%{limit}).
        Некоторые функции могут быть ограничены.
      error: "❌ Ошибка при работе с подпиской: %{error}"
      offer_message: |
        💡 У вас уже %{current} каналов из %{limit} бесплатных.

        🚀 Хотите добавлять неограниченное количество каналов?
      activate_button: "💎 Оформить подписку"
      channels_count: "Всего каналов: %{count}"

    messages:
      user_message: "Вы написали: %{text}"
      cancel: "Отмена"
      back: "← Назад"

    channel_deactivation:
      notification:
        title: "📢 Канал %{channel_name} деактивирован"
        message: |
          К сожалению, канал %{channel_name} был деактивирован.
          %{reason_text}

          Вы можете найти другие интересные каналы в каталоге.
        actions:
          browse_channels: "🔍 Посмотреть каталог каналов"
          notification_settings: "⚙️ Настройки уведомлений"
        reasons:
          admin_decision: "Решение администратора"
          inactive: "Канал неактивен длительное время"
          violation: "Нарушение правил платформы"
          technical: "Технические проблемы"

      admin_notification:
        title: "✅ Канал %{channel_name} деактивирован"
        message: |
          Канал %{channel_name} был успешно деактивирован.

          📊 Статистика отправки уведомлений:
          📤 Отправлено: %{sent_count}
          ❌ Ошибок: %{error_count}
          👥 Всего подписчиков: %{total_subscribers}
