# Russian locale file for NoFluff application

ru:
  hello: "Привет мир"

  telegram_bot:
    start:
      welcome: |
        👋 Привет! Я No Fluff Bot.

        Ты подписан на десятки Telegram-каналов, но читаешь лишь 10%?
        Я буду следить за ними и присылать тебе только важное.
        Без рекламы. Без шелухи.

        📊 Экономь до 40 минут в день на чтение каналов.

        Начнём?
      button_start: "🚀 Давай начнём"
      button_more_info: "ℹ️ Подробнее"

    more_info:
      text: |
        ℹ️ Как это работает?

        1️⃣ Ты добавляешь свои Telegram-каналы
        2️⃣ Я читаю все посты и фильтрую важное с помощью AI
        3️⃣ Присылаю тебе дайджест в удобное время

        ✨ Что я умею:
        • 🎯 Фильтрую важное, убираю рекламу и шелуху
        • 📝 Делаю саммари или присылаю полные тексты
        • ⏰ Контролируешь частоту (от реального времени до раза в неделю)
        • 🤖 Учусь на твоих лайках/дизлайках
        • 🔍 Рекомендую похожие каналы

        🆓 Бесплатно: до 10 каналов
        💎 Premium: безлимит каналов + приоритет + аналитика
      button_lets_start: "🚀 Начать использовать"

    onboarding:
      add_channels: |
        Отлично!

        📢 Пришли мне ссылки на Telegram-каналы, за которыми я буду следить.

        Можешь отправить:
        • Ссылку: t.me/channelname
        • Пересланное сообщение из канала
        • Несколько каналов сразу (каждый с новой строки)

        Например:
        t.me/habr_com
        t.me/dev_channel
        t.me/tech_news

        💡 Рекомендую начать с 5-10 каналов.
      button_my_subscriptions: "📋 Мои подписки"

    errors:
      general: "Произошла ошибка. Попробуйте позже."

    help:
      commands: |
        📱 Доступные команды:

        /start — начать заново
        /add — добавить каналы
        /remove — удалить каналы
        /list — мои каналы
        /settings — настройки
        /digest — показать дайджест сейчас
        /stats — статистика
        /help — помощь

    channels:
      add:
        prompt: |
          📢 Отправь мне ссылку или username канала.

          Можешь отправить:
          • Username: @channelname
          • Ссылку: t.me/channelname или https://t.me/channelname
          • Несколько каналов (каждый с новой строки)

          Например:
          @habr_com
          t.me/dev_channel
          https://t.me/tech_news
        success: "✅ Канал %{channel} добавлен!\n\nВсего каналов: %{count}"
        already_subscribed: "ℹ️ Ты уже подписан на канал %{channel}"
        not_found: "❌ Канал %{channel} не найден или недоступен"
        invalid_format: "❌ Неверный формат. Отправь username канала (@channelname) или ссылку (t.me/channelname)"
        error: "❌ Ошибка при добавлении канала: %{error}"
        limit_reached: "❌ Достигнут лимит каналов (%{limit}). Обновись до Premium для безлимита!"

      remove:
        prompt: |
          📢 Отправь мне username или ссылку на канал для удаления.

          Можешь отправить:
          • Username: @channelname
          • Ссылку: t.me/channelname или https://t.me/channelname

          Например:
          @habr_com
          t.me/dev_channel
          https://t.me/tech_news
        success: "✅ Канал %{channel} удалён!\n\nВсего каналов: %{count}"
        not_found: "❌ Канал %{channel} не найден в твоих подписках"
        not_subscribed: "ℹ️ Ты не подписан на канал %{channel}"
        invalid_format: "❌ Неверный формат. Отправь username канала (@channelname) или ссылку (t.me/channelname)"
        error: "❌ Ошибка при удалении канала: %{error}"

      list:
        title: "📋 Мои подписки"
        empty: "У тебя пока нет подписок. Используй /add чтобы добавить каналы."
        total: "Всего каналов: %{count}"
        channel_info: "• %{channel} (приоритет: %{priority})"
        buttons:
          remove: "🗑️"
          priority_up: "⬆️"
          priority_down: "⬇️"
          settings: "⚙️"
        confirm_remove: "Удалить %{channel} из подписок?"
        priority_updated: "Приоритет %{channel} изменён на %{priority}"
        remove_success: "Канал %{channel} удалён из подписок"